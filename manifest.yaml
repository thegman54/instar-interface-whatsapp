name: whatsapp
display_name: WhatsApp
description: WhatsApp Business Cloud API — inbound webhooks from Meta
version: "1.0"
type: interface
tenancy: single_tenant
connection:
  pattern: webhook
  port: 8089
  container_name: whatsapp-api
credentials:
  - WHATSAPP_ACCESS_TOKEN
  - WHATSAPP_PHONE_NUMBER_ID
  - WHATSAPP_VERIFY_TOKEN
  - WHATSAPP_APP_SECRET
